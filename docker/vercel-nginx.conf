worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    server {
        listen ATLAS_LISTEN_PORT;
        server_name _;

        location = /api { return 308 /api/; }
        location /api/ {
            proxy_pass http://127.0.0.1:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /remotes/catalog/ {
            alias /srv/atlas/app/public/;
            try_files $uri =404;
        }
        location /remotes/ui/ {
            alias /srv/atlas/design-system/public/;
            try_files $uri =404;
        }

        location = /docs { return 308 /docs/; }
        location /docs/ {
            alias /srv/atlas/docs/public/;
            index index.html;
            try_files $uri $uri/ $uri.html =404;
        }

        location = /storybook { return 308 /storybook/; }
        location /storybook/ {
            alias /srv/atlas/storybook/public/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
