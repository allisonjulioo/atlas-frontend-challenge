services:
  container:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        PROJECT: container
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 60); do
          wget -q -O /dev/null http://127.0.0.1:3002/_mf/mf-manifest.json \
            && wget -q -O /dev/null http://127.0.0.1:3003/_mf/mf-manifest.json \
            && break
          sleep 1
        done
        exec node .output/server/index.mjs
    ports:
      - '3000:3000'
      - '3001:3001'
      - '3002:3002'
      - '3003:3003'
      - '3004:3004'
      - '6006:6006'

  api:
    build: ./api
    network_mode: service:container
    volumes:
      - ./api/data:/var/www/html/data:ro
    depends_on:
      - container

  design-system:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        PROJECT: design-system
    network_mode: service:container
    environment:
      PORT: 3003
      HOST: 0.0.0.0
    depends_on:
      - container

  app:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        PROJECT: app
    network_mode: service:container
    environment:
      PORT: 3002
      HOST: 0.0.0.0
    depends_on:
      - container

  docs:
    build:
      context: .
      dockerfile: docker/static.Dockerfile
      args:
        PROJECT: docs
        BUILD_SCRIPT: build
        OUTPUT: docs/.vitepress/dist
    network_mode: service:container
    environment:
      PORT: 3004
    depends_on:
      - container

  storybook:
    build:
      context: .
      dockerfile: docker/static.Dockerfile
      args:
        PROJECT: design-system
        BUILD_SCRIPT: build-storybook
        OUTPUT: design-system/storybook-static
    network_mode: service:container
    environment:
      PORT: 6006
    depends_on:
      - container
